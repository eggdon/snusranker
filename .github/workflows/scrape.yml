name: Update snus data

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily (08:00 Swedish time)
  workflow_dispatch: # allow manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run scraper
        run: node scripts/scrape.mjs

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet src/data/products.json && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/products.json
          git commit -m "Update snus data $(date -u +%Y-%m-%d)"
          git push
